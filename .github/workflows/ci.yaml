name: CI

on:
  push:
    branches:
      - main
      - yeppp
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # File config Firebase asli di-ignore git (berisi API key). CI memakai
      # template non-secret agar analyze/test tetap bisa dikompilasi.
      - name: Provide Firebase options for CI
        run: cp tool/firebase_options.ci.dart lib/firebase_options.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
